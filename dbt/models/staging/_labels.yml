version: 2
models:
  - name: stg_labels
    description: >
      The public labels for wallets and contracts, read from `labels/labels.csv`. Each row records
      its source and confidence. Grain: one row per `chain` and `address`.
    columns:
      - name: chain
        description: '{{ doc("chain") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [tempo, ethereum, base, solana]
      - name: address
        description: 'The labeled address. Solana addresses are case-sensitive.'
        data_tests: [not_null]
      # entity is deliberately untested: unnamed clusters have none.
      - name: entity
        description: 'The name a public source gives the holder. Empty for an unnamed cluster.'
      - name: category
        description: 'What the address is: issuer, issuer_route, system, dex, lending, exchange or exchange_linked.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [issuer, issuer_route, system, dex, lending, exchange, exchange_linked]
      - name: source_type
        description: 'The kind of public source that supports the label.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - explorer_tag
                  - project_docs
                  - company_docs
                  - official_statement
                  - published_research
                  - onchain_metadata
                  - derived_rule
      - name: source_url
        description: 'Where the label can be checked.'
        data_tests: [not_null]
      - name: confidence
        description: 'How firmly the source supports the label: high or medium.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [high, medium]
      - name: date_checked
        description: '{{ doc("utc_day") }} The day the source was last checked.'
        data_tests: [not_null]
