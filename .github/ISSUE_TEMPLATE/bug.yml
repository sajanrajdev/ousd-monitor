name: Bug
description: Something in the pipeline or the site is broken.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [pipeline, dbt, web, docs, ops]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands or page URL. Do not paste keys or `.env` contents.
  - type: input
    id: version
    attributes:
      label: Commit or dataset version
      description: The commit, or the dataset version from the site footer.
