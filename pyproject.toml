[project]
name = "ousd-monitor"
version = "0.1.0"
description = "Ingests and reconciles Open USD (OUSD) transfers from raw chain data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
    "httpx>=0.27",
    "jsonschema>=4",
    "pyyaml>=6",
]

[project.scripts]
ousd = "ousd.cli:main"

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=8", "ruff>=0.6", "sqlfluff>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/ousd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["pipeline", "tests"]
# Lets a single-file run find conftest, and ousd from source rather than the installed copy.
mypy_path = ["pipeline", "tests"]
# Most tests have no annotations, and mypy skips the bodies of such functions by default.
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ousd.*"
disallow_untyped_defs = true
warn_return_any = true

# No stubs ship with these, and the stub packages would be dev dependencies for two imports.
[[tool.mypy.overrides]]
module = ["jsonschema.*", "yaml.*"]
ignore_missing_imports = true
